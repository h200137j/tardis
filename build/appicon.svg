<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4535"/>
      <stop offset="100%" stop-color="#072820"/>
    </linearGradient>
    <linearGradient id="dbTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3FAF5"/>
      <stop offset="100%" stop-color="#CCE8D6"/>
    </linearGradient>
    <linearGradient id="dbBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8D9C5"/>
      <stop offset="40%" stop-color="#D8EDDF"/>
      <stop offset="100%" stop-color="#A4C8B4"/>
    </linearGradient>
    <linearGradient id="dbBotGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#AECEBE"/>
      <stop offset="100%" stop-color="#92B8A4"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#44EF86"/>
      <stop offset="100%" stop-color="#1CA352"/>
    </linearGradient>
    <radialGradient id="glowBg" cx="50%" cy="68%" r="45%">
      <stop offset="0%" stop-color="#28C76F" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#28C76F" stop-opacity="0"/>
    </radialGradient>
    <filter id="boltBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="boltCrispGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dbShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>

  <!-- Subtle dot grid pattern -->
  <g fill="#28C76F" opacity="0.07">
    <circle cx="48"  cy="48"  r="1.5"/><circle cx="80"  cy="48"  r="1.5"/>
    <circle cx="176" cy="48"  r="1.5"/><circle cx="208" cy="48"  r="1.5"/>
    <circle cx="48"  cy="80"  r="1.5"/><circle cx="208" cy="80"  r="1.5"/>
    <circle cx="48"  cy="208" r="1.5"/><circle cx="208" cy="208" r="1.5"/>
    <circle cx="48"  cy="208" r="1.5"/><circle cx="80"  cy="224" r="1.5"/>
    <circle cx="176" cy="224" r="1.5"/><circle cx="208" cy="208" r="1.5"/>
  </g>

  <!-- Bolt glow bloom -->
  <polygon points="148,152 100,202 124,202 104,246 158,196 132,196"
           fill="#28C76F"
           opacity="0.45"
           filter="url(#boltBlur)"/>

  <!-- Radial glow behind bolt -->
  <ellipse cx="128" cy="195" rx="78" ry="58" fill="url(#glowBg)"/>

  <!-- Database shadow -->
  <ellipse cx="130" cy="170" rx="54" ry="10" fill="#000000" opacity="0.25"/>

  <!-- Database body -->
  <rect x="76" y="72" width="104" height="88" rx="3"
        fill="url(#dbBodyGrad)" filter="url(#dbShadow)"/>

  <!-- Database top cap -->
  <ellipse cx="128" cy="72" rx="52" ry="16" fill="url(#dbTopGrad)"/>

  <!-- Top cap inner shine -->
  <ellipse cx="112" cy="66" rx="24" ry="6.5" fill="white" opacity="0.22"/>

  <!-- Horizontal stripe lines -->
  <rect x="76" y="105" width="104" height="1.5" fill="#0D3B2E" opacity="0.18"/>
  <rect x="76" y="132" width="104" height="1.5" fill="#0D3B2E" opacity="0.18"/>

  <!-- Status LED dots -->
  <circle cx="93"  cy="119" r="3.5" fill="#28C76F" opacity="0.9"/>
  <circle cx="107" cy="119" r="3.5" fill="#28C76F" opacity="0.55"/>
  <circle cx="121" cy="119" r="3.5" fill="#28C76F" opacity="0.28"/>

  <!-- Database bottom cap -->
  <ellipse cx="128" cy="160" rx="52" ry="16" fill="url(#dbBotGrad)"/>

  <!-- Lightning bolt -->
  <polygon points="148,152 100,202 124,202 104,246 158,196 132,196"
           fill="url(#boltGrad)"
           filter="url(#boltCrispGlow)"/>

  <!-- Bolt edge highlight -->
  <polygon points="148,152 100,202 124,202 104,246 158,196 132,196"
           fill="none"
           stroke="white"
           stroke-width="1"
           stroke-linejoin="round"
           opacity="0.25"/>
</svg>
