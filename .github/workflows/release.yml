name: Release

# Tag push (v*) builds every platform and publishes the release as "latest".
#
# Manual run (Actions → Release → Run workflow) can build a subset of platforms.
# A release missing any platform is NOT marked "latest", so installed apps on the
# skipped platforms don't get an update banner for a build they can't use.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.1.1)'
        required: true
      linux:
        description: 'Build Linux (.deb)'
        type: boolean
        default: true
      windows:
        description: 'Build Windows'
        type: boolean
        default: true
      macos:
        description: 'Build macOS'
        type: boolean
        default: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-deb:
    if: github.event_name == 'push' || inputs.linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            pkg-config \
            dpkg-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build binary
        run: ~/go/bin/wails build -tags webkit2_41 -ldflags "-X main.version=${TAG}"

      - name: Package .deb
        run: |
          VERSION="${TAG#v}"
          PKG="tardis_${VERSION}_amd64"

          mkdir -p "${PKG}/DEBIAN"
          mkdir -p "${PKG}/usr/local/bin"
          mkdir -p "${PKG}/usr/share/applications"
          mkdir -p "${PKG}/usr/share/icons/hicolor/256x256/apps"

          cp build/bin/tardis "${PKG}/usr/local/bin/tardis"
          chmod 755 "${PKG}/usr/local/bin/tardis"

          cp build/appicon.png "${PKG}/usr/share/icons/hicolor/256x256/apps/tardis.png"

          cat > "${PKG}/usr/share/applications/tardis.desktop" <<EOF
          [Desktop Entry]
          Name=TARDIS
          Comment=Transfer And Retrieve Database In Seconds
          Exec=/usr/local/bin/tardis
          Icon=tardis
          Terminal=false
          Type=Application
          Categories=Development;Utility;
          EOF

          cat > "${PKG}/DEBIAN/control" <<EOF
          Package: tardis
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libwebkit2gtk-4.1-0
          Maintainer: TARDIS <noreply@github.com>
          Description: Transfer And Retrieve Database In Seconds
           A desktop app to pull a production MySQL database to your local
           machine or push it to a test server in a single click.
          EOF

          dpkg-deb --build --root-owner-group "${PKG}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: tardis_*.deb

  build-macos:
    if: github.event_name == 'push' || inputs.macos
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Go 1.22 binaries lack LC_UUID, which current macOS dyld refuses to run.
          # Wails 2.11's binding generator breaks on Go 1.27 ("package without types"),
          # so pin the combo known to work locally: Go 1.26 + Wails CLI 2.13.
          go-version: '1.26'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Stamp version into wails.json
        run: |
          jq --arg v "${TAG#v}" '.info.productVersion = $v' wails.json > wails.json.tmp
          mv wails.json.tmp wails.json

      - name: Build macOS universal binary
        run: ~/go/bin/wails build -platform darwin/universal -ldflags "-X main.version=${TAG}"

      - name: Zip app bundle
        run: ditto -c -k --sequesterRsrc --keepParent build/bin/TARDIS.app tardis-macos-universal.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: tardis-macos-universal.zip

  build-windows:
    if: github.event_name == 'push' || inputs.windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Stamp version into wails.json
        shell: bash
        run: |
          jq --arg v "${TAG#v}" '.info.productVersion = $v' wails.json > wails.json.tmp
          mv wails.json.tmp wails.json

      - name: Build Windows binary
        shell: bash
        run: ~/go/bin/wails build -ldflags "-X main.version=${TAG}"

      - name: Zip executable
        run: Compress-Archive -Path build/bin/tardis.exe -DestinationPath tardis-windows-amd64.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: tardis-windows-amd64.zip

  release:
    needs: [build-deb, build-macos, build-windows]
    # run when every selected build succeeded (skipped ones are fine)
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: "TARDIS ${{ env.TAG }}"
          make_latest: ${{ needs.build-deb.result == 'success' && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' }}
          files: dist/*
          body: |
            ## TARDIS ${{ env.TAG }}

            ### Install (Linux)
            ```bash
            sudo dpkg -i tardis_*_amd64.deb
            sudo apt-get install -f
            ```

            ### Run (Linux)
            ```bash
            tardis
            ```

            ### Install (Windows)
            Download `tardis-windows-amd64.zip`, extract and run `tardis.exe`.

            ### Install (macOS)
            Download `tardis-macos-universal.zip`, extract, and drag `TARDIS.app` into `/Applications`.

            This build isn't code-signed, so Gatekeeper will block it on first launch. Either:
            - Right-click (or Control-click) `TARDIS.app` → **Open** → **Open** again in the dialog, or
            - Run `xattr -cr /Applications/TARDIS.app` in Terminal, then open it normally.

            Needs the `mysql` client installed locally (e.g. `brew install mysql-client`). If it isn't found automatically, set **Settings → MySQL Binary Path**.
